<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hūxī — Furniture & Object Design Studio</title>
<meta name="description" content="Hūxī — a furniture and object design studio working in interior design: seating, work surfaces and custom furniture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #FFFFFF;
    --ink: #000000;
    --grey: #666666;
    --line: #DDDDDD;
    --font: 'Source Sans 3', 'Source Sans Pro', 'Noto Sans CJK JP', sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; background: #FFFFFF; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  body{
    min-height: 100vh;
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 400;
    font-style: normal;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  em, i{ font-style: normal; }
  a{ color: inherit; text-decoration: none; }
  ::selection{ background: var(--ink); color: var(--bg); }

  /* ---------- CUSTOM CURSOR ---------- */
  .cursor-dot{
    position: fixed;
    top: 0; left: 0;
    width: 16px; height: 16px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .18s ease, height .18s ease, opacity .18s ease;
    opacity: 0;
  }
  .cursor-dot.active{ opacity: 1; }
  .cursor-dot.grow{ width: 26px; height: 26px; border-width: 1.5px; }
  @media (pointer: coarse){ .cursor-dot{ display:none; } }
  html.has-cursor, html.has-cursor a{ cursor: none; }

  .wrap{ max-width: 1600px; margin: 0 auto; padding: 0 clamp(24px, 6vw, 100px); }

  /* ---------- HERO ---------- */
  .hero{
    height: 100vh;
    min-height: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  .hero-name{
    font-size: clamp(48px, 12vw, 140px);
    font-weight: normal;
    letter-spacing: 0.02em;
    display:flex;
  }
  .hero-name span{
    display:inline-block;
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.7s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .hero-tag{
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grey);
    opacity: 0;
    animation: fadein 1s ease forwards 1.1s;
  }
  @keyframes fadein{ to{ opacity:1; } }
  .scroll-cue{
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--grey);
    opacity: 0;
    animation: fadein 1s ease forwards 1.8s;
  }
  .scroll-cue .arrow{
    width: 1px;
    height: 26px;
    background: var(--grey);
    position: relative;
    animation: bob 1.8s ease-in-out infinite;
  }
  .scroll-cue .arrow::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    width:6px; height:6px;
    border-right:1px solid var(--grey);
    border-bottom:1px solid var(--grey);
    transform: translateX(-50%) rotate(45deg);
  }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(6px); } }

  /* ---------- HEADER ---------- */
  header{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 50;
    background: #FFFFFF;
    border-bottom: 1px solid var(--line);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  header.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .nav-inner{
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px clamp(24px, 6vw, 100px);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  header nav{
    display:flex;
    gap: 28px;
  }
  header nav a{
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color .2s ease;
  }
  header nav a:hover{ border-color: var(--ink); }

  .lang-switch{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-left: 24px;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .lang-switch button{
    background:none;
    border:none;
    font-family: var(--font);
    font-size: 12px;
    color: var(--grey);
    padding: 0;
    border-bottom: 1px solid transparent;
  }
  .lang-switch button.active{ color: var(--ink); border-color: var(--ink); }
  .lang-switch span{ color: var(--line); }

  /* ---------- WORK INDEX ---------- */
  .work-intro{
    padding: clamp(40px,7vw,72px) 0 clamp(16px,3vw,24px);
  }
  .work-intro .label{
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .work-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    padding-bottom: 60px;
  }
  .work-tile{
    background: var(--bg);
    aspect-ratio: 1 / 1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 20px;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .work-tile.in-view{ opacity:1; transform: translateY(0); }
  .work-tile svg{
    flex-grow: 1;
    width: 100%;
    height: 100%;
    transition: opacity .2s ease;
  }
  .work-tile{ padding:0 !important; overflow:hidden; }
  .work-tile-media{ position:relative; flex-grow:1; overflow:hidden; }
  .work-tile-media img, .work-tile-media .work-tile-placeholder{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
  .work-tile:hover .work-tile-media img, .work-tile:hover .work-tile-media .work-tile-placeholder{ transform: scale(1.08); }
  .work-tile{ position:relative; }
  .work-tile-caption{ position:absolute; left:0; right:0; bottom:0; padding:14px 20px 16px !important; border-top:none !important; background:rgba(255,255,255,0.92); opacity:0; transform:translateY(8px); transition:opacity .35s ease, transform .35s ease; pointer-events:none; }
  .work-tile:hover .work-tile-caption, .work-tile:focus-visible .work-tile-caption{ opacity:1; transform:translateY(0); }
  @media (hover: none){ .work-tile-caption{ opacity:1; transform:none; } }
  .work-tile-placeholder{
    flex-grow: 1;
    width: 100%;
    background-repeat: repeat;
    transition: opacity .2s ease;
  }

  .pattern-default{
    background-image: repeating-linear-gradient(45deg, #C4C4C4 0, #C4C4C4 1px, transparent 1px, transparent 9px);
  }
  .work-tile-caption{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .work-tile-name{
    font-size: 18px;
    letter-spacing: 0.01em;
  }
  .work-tile-status{
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey);
    text-align: right;
  }

  @media (max-width: 900px){
    .work-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px){
    .work-grid{ grid-template-columns: 1fr; }
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding: 26px clamp(24px, 6vw, 64px);
    border-top: 1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--grey);
  }
  footer a:hover{ color: var(--ink); }
  /* margini ridotti */
  .wrap{ max-width:none !important; padding:0 clamp(12px, 1.8vw, 28px) !important; }
  .nav-inner{ max-width:none !important; padding:16px clamp(12px, 1.8vw, 28px) !important; }
  footer{ padding:18px clamp(12px, 1.8vw, 28px) !important; }
  section.page{ padding:clamp(32px, 5vw, 64px) 0 !important; }
  .work-grid{ gap:12px !important; }
  .work-intro{ padding:clamp(20px, 3vw, 36px) 0 clamp(10px, 1.5vw, 16px) !important; }

  /* titolo grande al centro al passaggio */
  .work-tile-caption{ top:0 !important; bottom:0 !important; left:0; right:0; display:flex !important; flex-direction:column; align-items:center !important; justify-content:center !important; text-align:center; gap:10px; background:rgba(255,255,255,0.62) !important; transform:none !important; }
  .work-tile-caption .work-tile-name{ font-size:clamp(30px,3.6vw,56px); letter-spacing:0.02em; line-height:1.1; transform:translateY(10px); transition:transform .45s cubic-bezier(.2,.7,.2,1); }
  .work-tile-caption .work-tile-status{ text-align:center; transform:translateY(10px); transition:transform .45s cubic-bezier(.2,.7,.2,1) .05s; }
  .work-tile:hover .work-tile-caption .work-tile-name, .work-tile:hover .work-tile-caption .work-tile-status{ transform:translateY(0); }
  @media (hover: none){
    .work-tile-caption{ top:auto !important; background:rgba(255,255,255,0.9) !important; padding:12px 16px !important; opacity:1 !important; }
    .work-tile-caption .work-tile-name{ font-size:20px; transform:none; }
    .work-tile-caption .work-tile-status{ transform:none; }
  }
  /* ---------- PALCO: i lavori compaiono con lo scroll, la pagina resta ferma ---------- */
  html.stage, html.stage body{ height:100%; overflow:hidden; }
  html.stage .hero{ position:fixed; inset:0; height:auto; transition:opacity .8s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  html.stage .works-panel{ position:fixed; inset:0; overflow-y:auto; overscroll-behavior:contain; padding-top:64px; opacity:0; transform:translateY(60px); pointer-events:none; transition:opacity .8s ease, transform .9s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column; }
  html.stage .works-panel main{ flex:1 0 auto; width:100%; }
  html.stage.show-works .hero{ opacity:0; transform:translateY(-80px) scale(.96); pointer-events:none; }
  html.stage.show-works .works-panel{ opacity:1; transform:translateY(0); pointer-events:auto; }
  html.stage .work-tile{ opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .8s cubic-bezier(.2,.7,.2,1); }

      function applyLang(lang){
        nodes.forEach(el => { el.textContent = el.getAttribute('data-' + lang); });
        buttons.forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === lang));
        document.documentElement.lang = lang;
        localStorage.setItem('huxiLang', lang);
      }
      buttons.forEach(b => b.addEventListener('click', () => applyLang(b.getAttribute('data-lang'))));
      applyLang(localStorage.getItem('huxiLang') || 'en');
    })();

    // ---------- Palco: hero -> lavori senza scorrere la pagina ----------
    (function(){
      const root=document.documentElement, panel=document.getElementById('worksPanel'), header=document.getElementById('siteHeader');
      root.classList.add('stage');
      let open=false, lock=false;
      function set(v){
        if(v===open||lock) return;
        open=v; lock=true; setTimeout(()=>lock=false, 1100);
        root.classList.toggle('show-works', v); header.classList.toggle('visible', v);
        if(!v) panel.scrollTop=0;
      }
      window.addEventListener('wheel', e=>{
        if(Math.abs(e.deltaY)<4) return;
        if(!open && e.deltaY>0){ e.preventDefault(); set(true); }
        else if(open && e.deltaY<0 && panel.scrollTop<=0){ e.preventDefault(); set(false); }
      }, {passive:false});
      let ty=null;
      window.addEventListener('touchstart', e=>{ ty=e.touches[0].clientY; }, {passive:true});
      window.addEventListener('touchend', e=>{
        if(ty===null) return; const dy=ty-e.changedTouches[0].clientY; ty=null;
        if(dy>40 && !open) set(true);
        else if(dy<-40 && open && panel.scrollTop<=0) set(false);
      }, {passive:true});
      window.addEventListener('keydown', e=>{
        if(['ArrowDown','PageDown',' '].includes(e.key) && !open){ e.preventDefault(); set(true); }
        if(['ArrowUp','PageUp'].includes(e.key) && open && panel.scrollTop<=0){ e.preventDefault(); set(false); }
      });
      document.querySelector('.scroll-cue').addEventListener('click', e=>{ e.preventDefault(); set(true); });
      if(location.hash==='#work') set(true);
    })();

    // Custom cursor (mouse devices only)
    if (window.matchMedia('(pointer: fine)').matches) {
      document.documentElement.classList.add('has-cursor');
      const dot = document.getElementById('cursorDot');
      let x = window.innerWidth / 2, y = window.innerHeight / 2;
      let tx = x, ty = y;
      dot.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;

      window.addEventListener('mousemove', (e) => {
        tx = e.clientX; ty = e.clientY;
        dot.classList.add('active');
      });

      function loop(){
        x += (tx - x) * 0.2;
        y += (ty - y) * 0.2;
        dot.style.transform = `translate(${x}px, ${y}px) translate(-50%,-50%)`;
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      document.querySelectorAll('a').forEach(el => {
        el.addEventListener('mouseenter', () => dot.classList.add('grow'));
        el.addEventListener('mouseleave', () => dot.classList.remove('grow'));
      });

      document.addEventListener('mouseleave', () => dot.classList.remove('active'));
    }
  </script>

</body>
